    Experience:
      - company: Thuyloi University
        position: Lecturer
        location: Hanoi, Vietnam
        start_date: 2024
        summary: Grant writing & project management, research & technical development, and teaching.
        highlights:
          - "Developed early-stage research ideas into fundable proposal concepts for two approved grants: an industry-funded [VINIF project](https://vinif.org/annual/vinif-2025-da096-phat-trien-phuong-tien-tu-hanh-tich-hop-canh-tay-robot-phuc-vu-tham-do-moi-truong-duoi-long-dat/) on motion control of multi-unmanned vehicles (<strong class=\"cv-highlight\">USD 152K; started Dec. 2025</strong>) and a <strong class=\"cv-highlight\">publicly funded NAFOSTED national research grant</strong> on safety control for multi-shaft systems (<strong class=\"cv-highlight\">USD 68K; started Apr. 2025</strong>)."
          - "Prepared full grant application packages, including proposal narratives, technical work plans, itemized budgets, vendor quotations, and supporting documents for external funding evaluation."
          - "Served as <strong class=\"cv-highlight\">scientific secretary</strong> after project approval, coordinating team communication, tracking milestones and deliverables, organizing technical documents, and supporting PI-level progress reporting."
          - "Acted as a <strong class=\"cv-highlight\">key research team member</strong> during project implementation, developing technical ideas, conducting literature review and method design, drafting manuscripts, and preparing responses to peer-review comments."
          - "Published <strong class=\"cv-highlight\">15 peer-reviewed international journal papers</strong> over a two-year period, including ISA Transactions, IEEE Access, and International Journal of Robust and Nonlinear Control, on motion control for electromechanical systems."
          - "Second inventor of a pending <strong class=\"cv-highlight\">Vietnamese patent application</strong>: Centrifugal Air Compressor Driven by an Electric Motor Using Conical Active Magnetic Bearings, [Application No. 1-2025-08826](https://wipopublish.ipvietnam.gov.vn/wopublish-search/public/detail/patents?id=VN1202508826)."
          - "Developed fault-tolerant control strategies for nonlinear systems (<strong class=\"cv-highlight\">electric drives, electric cars, electromechanical systems, and renewable energy</strong>) with input saturation and time delays, ensuring prescribed-time convergence, bounded tracking errors, and robustness to actuator faults and disturbances."
          - "Teaching: Motion Control, Applied Programming, Actuators and Control, Swarm Robotics and Control."

      - company: Hanoi University of Science and Technology (HUST)
        position: Research Assistant
        location: Hanoi, Vietnam
        start_date: 2021
        end_date: 2025
        highlights:
          - "Prepared grant proposals and administrative documentation for three university-level research projects."
          - "Managed project close-out submissions, including technical reports, compliance files, acceptance documents, and final project dossiers."
          - "Designed advanced controllers, including fractional-order, nonlinear, and adaptive controllers, across projects on roll-to-roll systems (2021-2022), electric vehicles (2022-2023), and non-contact drives (2024-2025)."
          - "Developed mathematical models and validated control algorithms through MIL simulation using PLECS and CarSim, PIL testing using MATLAB and TI C2000 MCUs, and HIL testing using Typhoon HIL and dSPACE."
          - "Authored and reviewed research manuscripts in control systems, motion control, and electromechanical systems."

      - company: Hanoi University of Science and Technology (HUST)
        position: Teaching Assistant
        location: Hanoi, Vietnam
        start_date: 2021
        end_date: 2025
        summary: Acted as a research team leader, providing academic guidance and technical support to undergraduate students.
        highlights:
          - "HUST Scientific Research Student Conference: Won 02 First Prizes (2023, 2025) and 01 Second Prize (2024)."
          - "Ministry of Education and Training: Won 02 Second Prizes at the \"Science and Technology Award for Students in Higher Education Institutions\" (2023, 2025)."
          - "Assisted faculty members in teaching undergraduate courses, including Pneumatic and Hydraulic Automation Elements, Electrical Drives, and Graduation Projects."

      - company: IEEE Transactions on Transportation Electrification, ISA Transactions, Computers and Electrical Engineering, Scientific Reports, Nonlinear Dynamics, Electrical Engineering, Asian Journal of Control, Automatika, Robotics and Autonomous Systems, International Journal of Robust and Nonlinear Control
